{% extends "base.html" %}

{% block title %}登录 - 个人日记与学习追踪{% endblock %}

{% block content %}
<section class="mx-auto max-w-md py-10">
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div class="mb-6">
            <h1 class="text-2xl font-semibold">登录</h1>
            <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">默认账号来自环境变量，初次本地运行可使用 admin / change-me。</p>
        </div>

        <form method="post" class="space-y-4">
            <div>
                <label class="label" for="username">用户名</label>
                <input id="username" name="username" class="field" required autocomplete="username">
            </div>
            <div>
                <label class="label" for="password">密码</label>
                <input id="password" name="password" type="password" class="field" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary w-full justify-center">
                <i data-lucide="log-in" class="h-4 w-4"></i>
                登录
            </button>
        </form>
    </div>
</section>
{% endblock %}
